<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Number Counter</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#111}
.wrap{max-width:700px;margin:auto;padding:20px 16px 40px}
h1{font-size:30px;margin:8px 0 4px}.sub{color:#666;margin-bottom:18px}
textarea{width:100%;min-height:105px;border:1px solid #ccc;border-radius:14px;padding:14px;font-size:18px;background:white;outline:none}
button{border:0;border-radius:12px;padding:13px 18px;font-size:17px;font-weight:600;margin-top:10px;cursor:pointer}
.add{background:#007aff;color:white}.clear{background:#e5e5ea;color:#111;margin-left:8px}
.card{background:white;border-radius:16px;margin-top:20px;overflow:hidden}
.total{padding:18px;font-size:22px;font-weight:700;border-bottom:1px solid #eee}
table{width:100%;border-collapse:collapse}th,td{padding:12px 18px;text-align:right;border-bottom:1px solid #eee;font-size:17px}th:first-child,td:first-child{text-align:left}
.note{font-size:14px;color:#666;margin-top:12px;line-height:1.4}
</style>
</head>
<body>
<div class="wrap">
<h1>Number Counter</h1>
<div class="sub">Numbers ke saath (times) likhein, jaise: 12,21,90,09(40)</div>
<textarea id="input" placeholder="70,75,79,34,20,65,60(30)"></textarea>
<div><button class="add" onclick="addData()">ADD</button><button class="clear" onclick="clearData()">CLEAR</button></div>
<div class="card">
<div class="total">TOTAL: <span id="total">0</span> Times</div>
<table><thead><tr><th>Number</th><th>Times</th></tr></thead><tbody id="rows"></tbody></table>
</div>
<div class="note">Same number dobara aaye to uski quantity automatically add hogi. 01, 02, 09 jaise leading-zero numbers preserve rahenge.</div>
</div>
<script>
let data=JSON.parse(localStorage.getItem('numberCounterData')||'{}');
function render(){
 const keys=Object.keys(data).sort((a,b)=>Number(a)-Number(b));
 document.getElementById('rows').innerHTML=keys.map(k=>`<tr><td>${k}</td><td>${data[k]}</td></tr>`).join('');
 document.getElementById('total').textContent=keys.reduce((s,k)=>s+data[k],0);
 localStorage.setItem('numberCounterData',JSON.stringify(data));
}
function addData(){
 const raw=document.getElementById('input').value.trim();
 if(!raw)return;
 const m=raw.match(/\((\d+)\)\s*$/);
 if(!m){alert('End me (times) likhein, jaise (30)');return}
 const times=Number(m[1]);
 const nums=raw.slice(0,m.index).split(/[, ]+/).map(x=>x.trim()).filter(Boolean);
 nums.forEach(n=>{
   if(!/^\d+$/.test(n)){return}
   n=n.padStart(2,'0');
   data[n]=(data[n]||0)+times;
 });
 document.getElementById('input').value='';
 render();
}
function clearData(){
 if(confirm('Saara data delete karein?')){data={};render();}
}
render();
</script>
</body>
</html>
